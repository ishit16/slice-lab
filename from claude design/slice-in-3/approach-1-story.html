<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slice in 3 · Story</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { height: 100%; background: #11131a; }
  #root { height: 100%; display: flex; align-items: center; justify-content: center; }

  .stage { position: absolute; inset: 0; overflow: hidden; }
  .chapter { position: absolute; inset: 0; display: flex; flex-direction: column;
             padding: 132px 30px 116px; }

  /* entrance helpers — base state is the END state; animate FROM hidden */
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes sp-spin { to { transform: rotate(360deg); } }
  .anim { opacity: 0; animation: rise .62s cubic-bezier(.22,1,.36,1) forwards; }
  .animf { opacity: 0; animation: fade .7s ease forwards; }
  .animp { opacity: 0; animation: pop .55s cubic-bezier(.34,1.56,.64,1) forwards; }

  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  .big { font-weight: 500; letter-spacing: -0.03em; line-height: .96; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  /* Real browsers run the CSS animation clock. Some non-painting preview
     iframes freeze document.timeline at 0, which would leave entrance
     animations stuck on their hidden start-frame. If the clock hasn't
     advanced shortly after load, snap animations to their end state so
     content is never stuck hidden. No effect in a real browser. */
  (function () {
    function guard() {
      if (document.timeline && document.timeline.currentTime === 0) {
        var finishAll = function () {
          (document.getAnimations ? document.getAnimations() : []).forEach(function (a) {
            try { a.finish(); } catch (e) {}
          });
        };
        finishAll();
        new MutationObserver(finishAll).observe(document.documentElement, {
          subtree: true, childList: true, attributes: true,
        });
      }
    }
    window.addEventListener("load", function () { setTimeout(guard, 1400); });
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="slice-pie.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const BRAND = "#D30AD7";
const inr = (n) => "₹" + n.toLocaleString("en-IN");

/* ---------- individual chapters ---------- */

function ChHook() {
  return (
    <div className="chapter" style={{ background: "#fff", justifyContent: "flex-end" }}>
      <div style={{ position: "absolute", top: 118, right: 24 }} className="animp">
        <SlicePie size={92} spin idPrefix="h" />
      </div>
      <div className="eyebrow anim" style={{ color: BRAND, animationDelay: ".05s" }}>the headphones you keep opening</div>
      <div className="big anim tabular" style={{ fontSize: 92, marginTop: 14, animationDelay: ".12s" }}>{inr(9000)}</div>
      <div className="anim" style={{ fontSize: 21, color: "var(--t2)", marginTop: 18, lineHeight: 1.4, maxWidth: 300, animationDelay: ".26s" }}>
        Worth it. But ₹9,000 leaving your account in one go? That stings a little.
      </div>
    </div>
  );
}

function ChIdea() {
  return (
    <div className="chapter" style={{ background: "var(--bg3)", justifyContent: "center" }}>
      <div className="eyebrow anim" style={{ color: "var(--t3)" }}>here's a thought</div>
      <div className="big anim" style={{ fontSize: 46, marginTop: 16, lineHeight: 1.04, animationDelay: ".12s" }}>
        what if you didn't pay it <span style={{ color: BRAND }}>all at once?</span>
      </div>
      <div className="anim" style={{ marginTop: 28, animationDelay: ".4s", alignSelf: "center" }}>
        <SlicePie size={150} idPrefix="i" />
      </div>
    </div>
  );
}

function ChSplit() {
  const months = ["this month", "next month", "month after"];
  return (
    <div className="chapter grain" style={{ background: "linear-gradient(160deg,#E94BE8 0%,#D30AD7 42%,#7C2BD6 100%)", color: "#fff", justifyContent: "center" }}>
      <div className="eyebrow animf" style={{ color: "rgba(255,255,255,.8)" }}>slice in 3</div>
      <div className="animf" style={{ fontSize: 19, marginTop: 12, color: "rgba(255,255,255,.92)", animationDelay: ".1s" }}>
        {inr(9000)} becomes
      </div>
      <div style={{ marginTop: 22, display: "flex", flexDirection: "column", gap: 12, position: "relative", zIndex: 2 }}>
        {months.map((m, i) => (
          <div key={i} className="anim" style={{
            display: "flex", alignItems: "baseline", justifyContent: "space-between",
            background: "rgba(255,255,255,.14)", border: "1px solid rgba(255,255,255,.22)",
            borderRadius: 16, padding: "16px 18px", backdropFilter: "blur(4px)",
            animationDelay: (0.18 + i * 0.13) + "s",
          }}>
            <span style={{ fontSize: 14, color: "rgba(255,255,255,.85)" }}>{m}</span>
            <span className="tabular" style={{ fontSize: 30, fontWeight: 500, letterSpacing: "-.02em" }}>{inr(3000)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ChNoCost() {
  return (
    <div className="chapter" style={{ background: "#fff", justifyContent: "center" }}>
      <div className="eyebrow anim" style={{ color: "var(--green)" }}>the no-cost part</div>
      <div className="big anim" style={{ fontSize: 40, marginTop: 14, lineHeight: 1.06, animationDelay: ".1s" }}>
        you pay back <span className="tabular">{inr(9000)}</span>. exactly.
      </div>

      <div className="anim" style={{ marginTop: 30, animationDelay: ".26s" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 24, fontWeight: 500, color: "var(--t1)" }} className="tabular">
          <span>{inr(3000)}</span><Plus /><span>{inr(3000)}</span><Plus /><span>{inr(3000)}</span>
        </div>
        <div style={{ height: 1, background: "var(--border)", margin: "18px 0" }}></div>
        <div className="tabular" style={{ fontSize: 26, fontWeight: 500 }}>= {inr(9000)}</div>
      </div>

      <div style={{ marginTop: 30, display: "flex", flexDirection: "column", gap: 12 }}>
        {["no interest", "no GST", "no processing fee"].map((t, i) => (
          <div key={t} className="anim" style={{ display: "flex", alignItems: "center", gap: 12, animationDelay: (0.45 + i * 0.1) + "s" }}>
            <Check />
            <span style={{ fontSize: 17, color: "var(--t1)" }}>{t}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ChHow() {
  return (
    <div className="chapter" style={{ background: "var(--bg3)", justifyContent: "center" }}>
      <div className="eyebrow anim" style={{ color: "var(--t3)" }}>how you'd actually do it</div>
      <div className="big anim" style={{ fontSize: 30, marginTop: 14, lineHeight: 1.14, animationDelay: ".1s" }}>
        pay by UPI like always.<br />then just pick <span style={{ color: BRAND }}>slice in 3.</span>
      </div>
      {/* mini UPI sheet */}
      <div className="animp" style={{ marginTop: 24, background: "#fff", borderRadius: 22, boxShadow: "var(--shadow-card)", padding: 16, animationDelay: ".3s" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <span style={{ fontSize: 13, color: "var(--t3)" }}>paying boAt</span>
          <span className="tabular" style={{ fontSize: 17, fontWeight: 500 }}>{inr(9000)}</span>
        </div>
        <PayOption label="pay in full" sub={inr(9000) + " now"} />
        <PayOption label="slice in 3" sub={"3 × " + inr(3000) + " · no cost"} selected />
      </div>
    </div>
  );
}

function ChWhere({ onDone }) {
  return (
    <div className="chapter" style={{ background: "#fff", justifyContent: "center", alignItems: "center", textAlign: "center" }}>
      <div className="animp"><SlicePie size={120} spin idPrefix="w" /></div>
      <div className="big anim tabular" style={{ fontSize: 58, marginTop: 30, animationDelay: ".15s" }}>65M+</div>
      <div className="anim" style={{ fontSize: 19, color: "var(--t2)", marginTop: 10, maxWidth: 260, animationDelay: ".26s" }}>
        merchants. everywhere UPI works. on spends above {inr(2000)}.
      </div>
      <button className="anim" onClick={onDone} style={{
        marginTop: 38, background: BRAND, color: "#fff", border: 0, borderRadius: 999,
        font: "500 16px/1 var(--font)", padding: "17px 0", width: 240, cursor: "pointer",
        letterSpacing: ".02em", animationDelay: ".42s",
      }}>Got it</button>
      <div className="animf" style={{ marginTop: 16, fontSize: 11, color: "var(--t3)", animationDelay: ".6s" }}>
        eligible merchant spends only · see MITC
      </div>
    </div>
  );
}

/* ---------- tiny atoms ---------- */
function Plus() {
  return <span style={{ color: "var(--t3)", fontWeight: 400, fontSize: 20 }}>+</span>;
}
function Check() {
  return (
    <span style={{ width: 24, height: 24, borderRadius: 999, background: "rgba(0,166,62,.12)", display: "inline-flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
      <svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 7l3 3 6-7" stroke="#00A63E" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
    </span>
  );
}
function PayOption({ label, sub, selected }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 14,
      border: "1.5px solid " + (selected ? BRAND : "var(--border)"),
      background: selected ? "var(--brand-subtle)" : "#fff", marginBottom: 8,
    }}>
      <span style={{ width: 18, height: 18, borderRadius: 999, border: "2px solid " + (selected ? BRAND : "#CDD0D4"), display: "inline-flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
        {selected && <span style={{ width: 9, height: 9, borderRadius: 999, background: BRAND }}></span>}
      </span>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 15, fontWeight: 500, color: selected ? BRAND : "var(--t1)" }}>{label}</div>
        <div style={{ fontSize: 12, color: "var(--t3)", marginTop: 1 }}>{sub}</div>
      </div>
    </div>
  );
}

/* ---------- story engine ---------- */
const CHAPTERS = [ChHook, ChIdea, ChSplit, ChNoCost, ChHow, ChWhere];
const DURATIONS = [4200, 3800, 4600, 5200, 4600, 99999];

function Story() {
  const [i, setI] = useState(0);
  const [done, setDone] = useState(false);
  const [paused, setPaused] = useState(false);
  const [progress, setProgress] = useState(0);
  const raf = useRef(0);
  const start = useRef(0);
  const elapsedAtPause = useRef(0);

  const go = (next) => {
    const n = Math.max(0, Math.min(CHAPTERS.length - 1, next));
    setI(n); setProgress(0); elapsedAtPause.current = 0; start.current = 0;
  };

  useEffect(() => {
    if (done) return;
    const dur = DURATIONS[i];
    const tick = (t) => {
      if (!start.current) start.current = t - elapsedAtPause.current;
      if (paused) { start.current = t - elapsedAtPause.current; raf.current = requestAnimationFrame(tick); return; }
      const e = t - start.current;
      elapsedAtPause.current = e;
      const p = Math.min(1, e / dur);
      setProgress(p);
      if (p >= 1 && i < CHAPTERS.length - 1) { go(i + 1); return; }
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [i, paused, done]);

  const Ch = CHAPTERS[i];
  const W = 402;

  const tapZone = (e) => {
    const x = e.nativeEvent.offsetX;
    if (x < W * 0.32) go(i - 1); else if (i < CHAPTERS.length - 1) go(i + 1);
  };

  if (done) {
    return (
      <div className="chapter" style={{ background: "var(--bg3)", justifyContent: "center", alignItems: "center", textAlign: "center" }}>
        <SlicePie size={88} idPrefix="d" />
        <div className="big" style={{ fontSize: 28, marginTop: 24 }}>back to home</div>
        <div style={{ color: "var(--t3)", fontSize: 14, marginTop: 8 }}>(dismissed)</div>
        <button onClick={() => { setDone(false); go(0); }} style={{ marginTop: 24, background: "transparent", border: 0, color: BRAND, font: "500 15px var(--font)", cursor: "pointer" }}>replay</button>
      </div>
    );
  }

  return (
    <div className="stage">
      {/* progress bars */}
      <div style={{ position: "absolute", top: 60, left: 16, right: 16, display: "flex", gap: 5, zIndex: 30 }}>
        {CHAPTERS.map((_, idx) => (
          <div key={idx} style={{ flex: 1, height: 3, borderRadius: 9, background: "rgba(0,0,0,.12)", overflow: "hidden" }}>
            <div style={{ height: "100%", borderRadius: 9, background: idx <= i ? BRAND : "transparent",
              transform: `scaleX(${idx < i ? 1 : idx === i ? progress : 0})`, transformOrigin: "left", transition: "transform .08s linear" }} />
          </div>
        ))}
      </div>
      {/* close */}
      <button className="story-close-btn" onClick={() => setDone(true)} style={{ position: "absolute", top: 78, right: 18, zIndex: 30, width: 30, height: 30, borderRadius: 999, border: 0, background: "rgba(0,0,0,.04)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 2l9 9M11 2l-9 9" stroke="rgba(0,0,0,.55)" strokeWidth="1.7" strokeLinecap="round" /></svg>
      </button>

      {/* chapter (re-keyed so entrance anims replay) */}
      <div key={i}><Ch onDone={() => setDone(true)} /></div>

      {/* tap zones — pause on hold */}
      <div
        onClick={tapZone}
        onPointerDown={() => setPaused(true)}
        onPointerUp={() => setPaused(false)}
        onPointerLeave={() => setPaused(false)}
        style={{ position: "absolute", inset: 0, top: 96, zIndex: 20 }}
      />
    </div>
  );
}

function App() {
  const embed = new URLSearchParams(window.location.search).get("embed") === "1";
  if (embed) {
    // In embed mode: when Story signals "done", tell the parent to close the overlay
    React.useEffect(() => {
      const obs = new MutationObserver(() => {
        const dismissed = document.body.innerText.indexOf("back to home") !== -1;
        if (dismissed) {
          try { window.parent.postMessage({ type: "s3-story-close" }, "*"); } catch (e) {}
        }
      });
      obs.observe(document.body, { subtree: true, childList: true, characterData: true });
      return () => obs.disconnect();
    }, []);
    return (
      <div style={{ position: "fixed", inset: 0, background: "#fff", overflow: "hidden" }}>
        <style>{`.story-close-btn { display: none !important; }`}</style>
        <Story />
      </div>
    );
  }
  return (
    <IOSDevice>
      <div style={{ position: "absolute", inset: 0 }}><Story /></div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
